<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>VIMAL Photos</title>
<link rel="icon" type="image/jpg" href="https://res.cloudinary.com/dvi64ritf/image/upload/v1771854210/Vimal_Soren_zpkdfk.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4efe6;--bg2:#ebe4d6;--bg3:#e3dacb;--ink:#17161a;--ink2:#3d3a36;--line:#17161a;--line2:#c9c0ad;--muted:#6f6a5f;--accent:#e8501f;--accent2:#ffb800;--danger:#b3251c;--r:2px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100svh}
body.menu-open{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;line-height:1.02;letter-spacing:-.03em}
.muted{color:var(--muted)}
section[id]{scroll-margin-top:80px}
.btn{display:inline-block;background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:var(--r);padding:14px 30px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.18s cubic-bezier(.2,.7,.3,1);text-align:center;box-shadow:4px 4px 0 var(--accent);-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:6px 6px 0 var(--ink);transform:translate(-2px,-2px)}
.btn:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink);box-shadow:4px 4px 0 var(--accent2)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);box-shadow:6px 6px 0 var(--accent2);transform:translate(-2px,-2px)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);box-shadow:4px 4px 0 rgba(179,37,28,.3)}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);box-shadow:6px 6px 0 var(--ink);transform:translate(-2px,-2px)}
.btn.sm{padding:9px 16px;font-size:10px;letter-spacing:.12em;box-shadow:3px 3px 0 var(--accent)}
.btn.sm.ghost{box-shadow:3px 3px 0 var(--accent2)}
.btn.sm:hover{box-shadow:5px 5px 0 var(--ink)}
.btn.sm.ghost:hover{box-shadow:5px 5px 0 var(--accent2)}
.btn.danger.sm{box-shadow:3px 3px 0 rgba(179,37,28,.3)}
.btn.danger.sm:hover{box-shadow:5px 5px 0 var(--ink)}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 40px;transition:.3s;color:var(--ink);border-bottom:2px solid transparent}
.nav.scrolled{background:var(--bg);border-bottom-color:var(--ink);padding:14px 40px;box-shadow:0 4px 0 rgba(23,22,26,.06)}
.brand{font-family:'Space Grotesk',sans-serif;font-size:24px;letter-spacing:-.04em;font-weight:700;color:inherit;display:flex;align-items:center;gap:10px;min-width:0}
.brand::before{content:'';display:inline-block;width:12px;height:12px;background:var(--accent);border:2px solid var(--ink);flex:none}
.nav-links{display:flex;align-items:center;gap:32px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.nav-links a{color:var(--ink);transition:.18s;position:relative;padding-bottom:3px}
.nav-links a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--accent);transition:width .25s cubic-bezier(.2,.7,.3,1)}
.nav-links a:hover::after{width:100%}
.nav-links a:hover{color:var(--accent)}
.nav-toggle{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:46px;height:42px;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);cursor:pointer;flex:none;position:relative;z-index:60;box-shadow:3px 3px 0 var(--ink);-webkit-tap-highlight-color:transparent}
.nav-toggle span{display:block;width:20px;height:2px;background:var(--ink);border-radius:0;transition:.28s}
.nav-toggle.open{background:var(--accent);border-color:var(--ink)}
.nav-toggle.open span{background:#fff}
.nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-toggle.open span:nth-child(2){opacity:0}
.nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.hero{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:60px;padding:150px 60px 90px;max-width:1400px;margin:0 auto;min-height:100vh;min-height:100svh}
.hero-inner{max-width:640px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink);margin-bottom:26px;font-weight:700;display:inline-flex;align-items:center;gap:12px;background:var(--accent2);border:2px solid var(--ink);padding:6px 14px;box-shadow:3px 3px 0 var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero h1{font-size:clamp(2.8rem,6.5vw,5.6rem);margin-bottom:28px;line-height:0.98;overflow-wrap:break-word}
.hero-sub{color:var(--ink2);font-size:17px;font-weight:400;margin-bottom:40px;max-width:520px;line-height:1.65}
.hero-visual{position:relative;padding:20px;min-width:0}
.hero-frame{aspect-ratio:4/5;background-size:cover;background-position:center;border:3px solid var(--ink);box-shadow:20px 20px 0 var(--accent);animation:kb 20s ease-out forwards}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
.section{padding:130px 60px;border-top:2px solid var(--ink)}
.container{max-width:1300px;margin:0 auto;width:100%}
.section-head{margin-bottom:60px;max-width:760px}
.section-tag{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.28em;font-weight:700;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:6px 14px;margin-bottom:22px}
.section-tag::before{content:'';width:8px;height:8px;background:var(--accent);flex:none}
.section-head h2{font-size:clamp(2.6rem,6vw,4.6rem);margin-bottom:12px;letter-spacing:-.04em;overflow-wrap:break-word}
.section-head p{color:var(--muted);font-size:14px;letter-spacing:.06em;max-width:520px}

.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:52px;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);padding:9px 10px 9px 18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:.18s cubic-bezier(.2,.7,.3,1);font-weight:700;font-family:'Space Grotesk',sans-serif;box-shadow:3px 3px 0 var(--ink);-webkit-tap-highlight-color:transparent}
.chip:hover{background:var(--chip, var(--accent2));transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.chip:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink)}
.chip.active{background:var(--chip, var(--accent2));box-shadow:5px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.chip .chip-count{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;background:var(--ink);color:var(--bg);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:.02em;border-radius:var(--r);line-height:1;transition:.18s}
.chip.active .chip-count{background:#fff;color:var(--ink);border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:22px;counter-reset:card;transition:opacity .25s ease}
.grid.fading{opacity:.2}
.card{position:relative;overflow:hidden;border-radius:var(--r);cursor:pointer;background:var(--bg3);aspect-ratio:4/5;border:2px solid var(--ink);counter-increment:card;transition:.22s cubic-bezier(.2,.7,.3,1);animation:cardIn .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:counter(card,decimal-leading-zero);position:absolute;top:12px;left:12px;z-index:4;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--bg);color:var(--ink);border:2px solid var(--ink);padding:3px 8px;line-height:1}
.card-cat{position:absolute;top:12px;right:12px;z-index:4;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--cat, var(--accent2));color:var(--ink);border:2px solid var(--ink);padding:4px 10px;line-height:1;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);transition:.25s cubic-bezier(.2,.7,.3,1);max-width:calc(100% - 70px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:hover .card-cat{transform:rotate(0deg) translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.3,1)}
.card:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--accent)}
.card:hover img{transform:scale(1.06)}
.card figcaption{position:absolute;inset:auto 0 0 0;padding:52px 18px 18px;background:linear-gradient(transparent,rgba(23,22,26,.94));transform:translateY(8px);opacity:0;transition:.35s cubic-bezier(.2,.7,.3,1);color:#fff}
.card:hover figcaption{transform:translateY(0);opacity:1}
.card h3{font-size:22px;color:#fff;letter-spacing:-.02em;line-height:1.1;overflow-wrap:break-word}
@media (hover:none){.card figcaption{opacity:1;transform:none}.card:hover img{transform:none}.card:hover{transform:none;box-shadow:none}.card:hover .card-cat{transform:rotate(-2deg)}}

/* =========================================================
   PAGINATION — Text only:  Previous   1 / 4   Next
   Compact but comfortable tap targets
   ========================================================= */
.pager{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin-top:52px;
  padding-top:34px;
  border-top:1px solid var(--line2);
  flex-wrap:nowrap;
  width:100%;
}
.pager-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--ink);
  border:2px solid var(--ink);
  border-radius:var(--r);
  padding:12px 24px;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  cursor:pointer;
  transition:.18s cubic-bezier(.2,.7,.3,1);
  box-shadow:3px 3px 0 var(--ink);
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
  flex:0 0 auto;
  line-height:1;
  min-height:44px;
}
.pager-btn:hover:not(:disabled){
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  transform:translate(-2px,-2px);
  box-shadow:5px 5px 0 var(--ink);
}
.pager-btn:active:not(:disabled){
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  transform:translate(0,0);
  box-shadow:1px 1px 0 var(--ink);
}
.pager-btn:disabled{
  opacity:.3;
  cursor:not-allowed;
  box-shadow:1px 1px 0 var(--ink);
}
.pager-info{
  font-family:'Space Grotesk',sans-serif;
  font-size:14px;
  font-weight:700;
  letter-spacing:.14em;
  color:var(--ink);
  padding:0 4px;
  white-space:nowrap;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:44px;
}
.pager-info .curr{color:var(--accent)}
.pager-info .sep{color:var(--muted);font-weight:400}

/* Tablet */
@media(max-width:768px){
  .pager{gap:14px;margin-top:42px;padding-top:28px}
  .pager-btn{padding:12px 18px;font-size:11px;letter-spacing:.14em;min-height:46px}
  .pager-info{font-size:13px;letter-spacing:.12em;gap:5px;padding:0 2px;min-height:46px}
}

/* Phone — a little smaller than before */
@media(max-width:480px){
  .pager{gap:10px;margin-top:36px;padding-top:24px}
  .pager-btn{
    flex:1 1 0;
    min-width:0;
    padding:12px 10px;
    font-size:11px;
    letter-spacing:.08em;
    box-shadow:2px 2px 0 var(--ink);
    min-height:48px;
  }
  .pager-btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .pager-info{font-size:13px;letter-spacing:.08em;padding:0;gap:4px;min-height:48px}
}

/* Small phone */
@media(max-width:380px){
  .pager{gap:8px;margin-top:32px;padding-top:22px}
  .pager-btn{
    padding:11px 8px;
    font-size:10px;
    letter-spacing:.05em;
    box-shadow:2px 2px 0 var(--ink);
    min-height:46px;
  }
  .pager-info{font-size:12px;letter-spacing:.05em;gap:3px;min-height:46px}
}

/* Tiny phone */
@media(max-width:320px){
  .pager{gap:6px;margin-top:28px;padding-top:20px}
  .pager-btn{
    padding:10px 6px;
    font-size:9.5px;
    letter-spacing:.03em;
    box-shadow:2px 2px 0 var(--ink);
    min-height:44px;
  }
  .pager-info{font-size:11px;letter-spacing:.03em;gap:2px;min-height:44px}
}

.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.about-figure{position:relative;margin:0;min-width:0}
.about-figure::before{content:'';position:absolute;inset:18px -18px -18px 18px;background:var(--accent2);border:2px solid var(--ink);z-index:0}
.about-figure img{position:relative;z-index:1;aspect-ratio:4/5;object-fit:cover;width:100%;display:block;border:3px solid var(--ink)}
.about-text{min-width:0}
.about-text h2{font-size:clamp(2.4rem,5.5vw,4rem);margin-bottom:26px;letter-spacing:-.04em;overflow-wrap:break-word}
.about-text p{color:var(--ink2);margin-bottom:16px;font-weight:400;font-size:16px}
.contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px}
.contact-card{border:2px solid var(--ink);border-radius:var(--r);padding:32px 26px;background:var(--bg);transition:.22s cubic-bezier(.2,.7,.3,1);box-shadow:6px 6px 0 var(--ink);min-width:0}
.contact-card:nth-child(1){box-shadow:6px 6px 0 var(--accent)}
.contact-card:nth-child(2){box-shadow:6px 6px 0 var(--accent2)}
.contact-card:nth-child(3){box-shadow:6px 6px 0 var(--ink)}
.contact-card:hover{background:var(--bg2);transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink)}
.contact-card:nth-child(1):hover{box-shadow:10px 10px 0 var(--accent)}
.contact-card:nth-child(2):hover{box-shadow:10px 10px 0 var(--accent2)}
.contact-card span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);display:inline-block;margin-bottom:12px;font-weight:700;background:var(--accent2);border:2px solid var(--ink);padding:2px 8px}
.contact-card strong{font-weight:600;font-size:17px;word-break:break-word;display:block;font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
.social-rail{position:fixed;left:20px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:12px}
.social-rail .social-btn{display:grid;place-items:center;width:48px;height:48px;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);color:var(--ink);box-shadow:4px 4px 0 var(--accent);transition:.18s cubic-bezier(.2,.7,.3,1);-webkit-tap-highlight-color:transparent}
.social-rail .social-btn:nth-child(2){box-shadow:4px 4px 0 var(--accent2)}
.social-rail .social-btn:nth-child(3){box-shadow:4px 4px 0 var(--ink)}
.social-rail .social-btn svg{width:20px;height:20px;display:block}
.social-rail .social-btn:hover{background:var(--ink);color:var(--bg);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--accent)}
.social-rail .social-btn:nth-child(2):hover{box-shadow:6px 6px 0 var(--accent2)}
.social-rail .social-btn:nth-child(3):hover{box-shadow:6px 6px 0 var(--ink)}
.social-rail .social-btn:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--accent)}
.social-rail .social-btn:nth-child(2):active{box-shadow:2px 2px 0 var(--accent2)}
.social-rail .social-btn:nth-child(3):active{box-shadow:2px 2px 0 var(--ink)}
footer{border-top:2px solid var(--ink);padding:44px 60px;text-align:center;color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:var(--bg2)}
footer a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(20,19,15,.97);display:none;place-items:center;padding:60px 20px}
.lightbox.open{display:grid}
.lightbox img{max-height:78vh;max-width:min(1100px,92vw);object-fit:contain;margin:0 auto;border:3px solid var(--bg);box-shadow:12px 12px 0 var(--accent)}
.lb-info{text-align:center;margin-top:28px;color:#fff}
.lb-info h3{font-size:26px;font-weight:700;letter-spacing:-.03em}
.lb-info .lb-cat{display:inline-block;margin-top:10px;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:var(--cat, var(--accent2));border:2px solid var(--bg);padding:4px 12px;box-shadow:3px 3px 0 var(--bg)}
.lb-info p{color:rgba(255,255,255,.7);font-size:14px;max-width:600px;margin:10px auto 0}
.lb-close{position:absolute;top:22px;right:26px;background:var(--bg);border:2px solid var(--ink);font-size:22px;cursor:pointer;color:var(--ink);line-height:1;width:48px;height:48px;display:grid;place-items:center;border-radius:var(--r);transition:.18s;font-weight:700;box-shadow:3px 3px 0 var(--accent);-webkit-tap-highlight-color:transparent}
.lb-close:hover{background:var(--accent);color:#fff;transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--bg)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--bg);border:2px solid var(--ink);width:54px;height:54px;border-radius:var(--r);font-size:22px;cursor:pointer;color:var(--ink);transition:.18s;display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-weight:700;box-shadow:4px 4px 0 var(--accent)}
.lb-nav:hover{background:var(--accent);color:#fff;transform:translateY(-50%) translate(-2px,-2px);box-shadow:6px 6px 0 var(--bg)}
.lb-nav:active{transform:translateY(-50%) translate(0,0);box-shadow:2px 2px 0 var(--bg)}
.lb-prev{left:24px}
.lb-next{right:24px}
.admin{min-height:100vh;min-height:100svh;background:var(--bg)}
.admin-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 32px;border-bottom:2px solid var(--ink);background:var(--bg);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.admin-bar .brand{font-size:19px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.badge{font-family:'Space Grotesk',sans-serif;font-size:10px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;background:var(--accent);color:#fff;padding:4px 10px;border-radius:var(--r);border:2px solid var(--ink);flex:none}
.sync-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999;margin-left:8px;flex:none;transition:.3s}
.sync-dot.ok{background:#0a8f3d}
.sync-dot.syncing{background:#f0a500;animation:pulse 1s infinite}
.sync-dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.admin-actions{display:flex;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:0;padding:0 32px;background:var(--bg2);border-bottom:2px solid var(--ink);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:18px 22px;cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:.18s;white-space:nowrap;flex:none;font-weight:700;-webkit-tap-highlight-color:transparent}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--bg)}
.admin-main{max-width:1200px;margin:0 auto;padding:38px 32px 80px;display:grid;gap:28px;width:100%}
.panel{border:2px solid var(--ink);border-radius:var(--r);background:var(--bg);padding:32px;box-shadow:8px 8px 0 var(--bg3);min-width:0}
.panel h2{font-size:26px;margin-bottom:26px;letter-spacing:-.03em;padding-bottom:14px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.form{display:grid;gap:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form label,.form-field{display:grid;gap:8px;min-width:0}
.form label,.form-field-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:700}
.form-field-label{display:block}
.form-field{position:relative}
.form input,.form textarea,.form select{background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);width:100%;transition:.18s;font-family:'Inter',sans-serif;font-weight:400;min-width:0}
.form input:focus,.form textarea:focus,.form select:focus{outline:none;box-shadow:4px 4px 0 var(--accent);transform:translate(-1px,-1px)}
.form input::placeholder,.form textarea::placeholder{color:#a79e8a}
.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.preview{max-height:230px;border-radius:var(--r);border:2px solid var(--ink);object-fit:cover;width:auto;max-width:100%;box-shadow:5px 5px 0 var(--accent)}
.preview-wrap{display:grid;gap:14px;justify-items:start}
.img-upload{display:grid;grid-template-columns:1fr 1fr;gap:16px;border:2px dashed var(--ink);border-radius:var(--r);padding:22px;background:var(--bg2)}
.img-upload .full{grid-column:1/-1}
.file-upload{display:flex;align-items:stretch;gap:10px;width:100%;min-width:0}
.file-upload input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.file-upload-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 24px;min-height:48px;background:var(--bg2);border:2px solid var(--ink);border-radius:var(--r);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);cursor:pointer;box-shadow:4px 4px 0 var(--accent2);transition:.18s cubic-bezier(.2,.7,.3,1);-webkit-tap-highlight-color:transparent;white-space:nowrap;user-select:none}
.file-upload-btn:hover{background:var(--ink);color:var(--bg);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--accent2)}
.file-upload-btn:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--accent2)}
.file-upload input[type=file]:focus-visible + .file-upload-btn{box-shadow:0 0 0 3px var(--accent2), 4px 4px 0 var(--accent2);transform:translate(-2px,-2px)}
.file-upload-name{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 16px;min-height:48px;background:var(--bg);border:2px dashed var(--line2);border-radius:var(--r);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:.22s cubic-bezier(.2,.7,.3,1);overflow:hidden}
.file-upload-name .file-upload-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-upload-name::before{content:'';display:inline-block;width:10px;height:10px;border:2px solid var(--line2);border-radius:50%;flex:none;transition:.22s}
.file-upload-name.has-file{background:var(--bg2);border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:600}
.file-upload-name.has-file::before{background:var(--accent);border-color:var(--ink);border-radius:0;transform:rotate(45deg)}
.file-upload-clear{flex:none;width:48px;min-height:48px;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;line-height:1;cursor:pointer;transition:.18s cubic-bezier(.2,.7,.3,1);box-shadow:4px 4px 0 var(--danger);display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent}
.file-upload-clear:hover{background:var(--danger);color:#fff;border-color:var(--danger);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.file-upload-clear:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink)}
.cat-select{position:relative;width:100%}
.cat-select-trigger{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);padding:10px 14px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--ink);cursor:pointer;text-align:left;transition:.18s cubic-bezier(.2,.7,.3,1);-webkit-tap-highlight-color:transparent}
.cat-select-trigger:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--accent)}
.cat-select-trigger.open{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--accent)}
.cat-select-trigger .cat-dot{width:16px;height:16px;background:var(--cat, var(--accent2));border:2px solid var(--ink);flex:none;transition:.2s}
.cat-select-trigger .cat-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.14em;text-transform:uppercase;font-size:11px;font-weight:700}
.cat-select-trigger .cat-name.is-empty{color:var(--muted);font-weight:600}
.cat-select-trigger .cat-caret{flex:none;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.cat-select-trigger.open .cat-caret{transform:rotate(180deg)}
@keyframes catDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.cat-select-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--bg);border:2px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink);z-index:30;max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px;display:none}
.cat-select-menu.open{display:block;animation:catDrop .18s cubic-bezier(.2,.7,.3,1)}
.cat-select-option{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:2px solid transparent;border-radius:var(--r);padding:10px 12px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);cursor:pointer;text-align:left;transition:.14s;-webkit-tap-highlight-color:transparent}
.cat-select-option + .cat-select-option{margin-top:2px}
.cat-select-option:hover{background:var(--cat, var(--accent2));border-color:var(--ink)}
.cat-select-option.selected{background:var(--cat, var(--accent2));border-color:var(--ink)}
.cat-select-option .cat-dot{width:14px;height:14px;background:var(--cat, var(--accent2));border:2px solid var(--ink);flex:none;transition:.2s}

.cat-select-option .cat-opt-count{flex:none;display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;line-height:1;border-radius:var(--r)}
.cat-select-option.uncat{font-style:italic}
.cat-select-option.uncat .cat-dot{background:transparent;border-style:dashed}

.cat-select-divider{display:flex;align-items:center;gap:10px;padding:10px 10px 6px;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}

.cat-select-new{display:flex;gap:6px;margin-top:4px;padding-top:8px;border-top:2px dashed var(--line2)}

function fileToDataURL(file, maxW = 1600, quality = 0.82){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = async () => {
        try{
          let { width, height } = img;
          if(width > maxW){ height = Math.round(height * maxW / width); width = maxW; }
          const c = document.createElement('canvas');
          c.width = width; c.height = height;
          c.getContext('2d').drawImage(img, 0, 0, width, height);
          const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
          const fd = new FormData();
          fd.append('file', blob);
          fd.append('upload_preset', CLOUDINARY_PRESET);
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`, { method:'POST', body:fd });
          if(!res.ok){ const t = await res.text(); throw new Error('Cloudinary: ' + t.slice(0,180)); }
          const data = await res.json();
          resolve(data.secure_url);
        }catch(err){ reject(err); }
      };
      img.onerror = () => reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function galleryHTML(){
  const cats = categoryList();
  visibleList = currentFilter === 'All' ? state.photos : state.photos.filter(p => (p.category || '') === currentFilter);

  const totalPages = Math.max(1, Math.ceil(visibleList.length / PER_PAGE));
  if(currentPage > totalPages) currentPage = totalPages;
  if(currentPage < 1) currentPage = 1;

  const filters = cats.map(c => {
    const color = colorForCategory(c);
    const count = countForCategory(c);
    const label = c || 'Uncategorised';
    return `<button class="chip ${c === currentFilter ? 'active' : ''}" data-filter="${esc(c)}" style="--chip:${color}" type="button"><span>${esc(label)}</span><span class="chip-count">${count}</span></button>`;
  }).join('');

  const start = (currentPage - 1) * PER_PAGE;
  const pagePhotos = visibleList.slice(start, start + PER_PAGE);
  const cards = pagePhotos.map((p, i) => {
    const color = colorForCategory(p.category);
    const catLabel = p.category || 'Uncategorised';
    return `<figure class="card" data-index="${start + i}" style="animation-delay:${i*0.03}s">
      <span class="card-cat" style="--cat:${color}">${esc(catLabel)}</span>
      <img src="${esc(p.src)}" alt="${esc(p.title)}" loading="lazy">
      <figcaption><h3>${esc(p.title)}</h3></figcaption>
    </figure>`;
  }).join('');

  let pagerBlock = '';
  if(visibleList.length > PER_PAGE){
    const atFirst = currentPage === 1;
    const atLast  = currentPage === totalPages;
    pagerBlock = `
      <div class="pager">
        <button type="button" class="pager-btn" id="prevPageBtn" ${atFirst ? 'disabled' : ''} aria-label="Previous page">Previous</button>
        <span class="pager-info">
          <span class="curr">${currentPage}</span>
          <span class="sep">/</span>
          ${totalPages}
        </span>
        <button type="button" class="pager-btn" id="nextPageBtn" ${atLast ? 'disabled' : ''} aria-label="Next page">Next</button>
      </div>`;
  }

  return `
    <div class="filters" role="tablist" aria-label="Filter by category">${filters}</div>
    <div class="grid">${cards || '<p class="muted">No photos in this category.</p>'}</div>
    ${pagerBlock}`;
}

function bindPublic(){

    });

  });

function goToPage(p){
  const totalPages = Math.max(1, Math.ceil(visibleList.length / PER_PAGE));
  if(p < 1 || p > totalPages || p === currentPage) return;
  currentPage = p;
  const grid = document.querySelector('.grid');
  if(grid) grid.classList.add('fading');
  setTimeout(() => {
    $('#galleryBody').innerHTML = galleryHTML();
    bindPublic();
    scrollToGalleryTop();

}

function ensureLightbox(){
  if(lbEl) return lbEl;
  lbEl = document.createElement('div');
  lbEl.id = 'lightbox';
  lbEl.className = 'lightbox';
  document.body.appendChild(lbEl);
  let tx = 0, ty = 0;
  lbEl.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive:true });
  lbEl.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) stepLightbox(dx < 0 ? 1 : -1);
  }, { passive:true });
  return lbEl;
}
function openLightbox(i){
  if(i < 0 || i >= visibleList.length) return;
  lbIndex = i;
  const p = visibleList[i];
  const lb = ensureLightbox();
  const catColor = colorForCategory(p.category);
  lb.innerHTML = `
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" aria-label="Previous">&#8249;</button>
    <button class="lb-nav lb-next" aria-label="Next">&#8250;</button>
    <div>
      <img src="${esc(p.src)}" alt="${esc(p.title)}">
      <div class="lb-info">
        <h3>${esc(p.title)}</h3>
        ${p.category ? `<span class="lb-cat" style="--cat:${catColor}">${esc(p.category)}</span>` : ''}
        ${p.description ? `<p>${esc(p.description)}</p>` : ''}
      </div>
    </div>`;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  lb.querySelector('.lb-close').onclick = closeLightbox;
  lb.querySelector('.lb-prev').onclick = e => { e.stopPropagation(); stepLightbox(-1); };
  lb.querySelector('.lb-next').onclick = e => { e.stopPropagation(); stepLightbox(1); };
  lb.onclick = e => { if(e.target === lb) closeLightbox(); };
}
function stepLightbox(d){ if(!visibleList.length) return; lbIndex = (lbIndex + d + visibleList.length) % visibleList.length; openLightbox(lbIndex); }
function closeLightbox(){ if(lbEl) lbEl.classList.remove('open'); document.body.style.overflow = ''; lbIndex = -1; }
document.addEventListener('keydown', e => {
  if(lbIndex < 0) return;
  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowLeft') stepLightbox(-1);
  if(e.key === 'ArrowRight') stepLightbox(1);
});

function bindCategoryDropdown(){
  const catSelect = $('#catSelect');
  if(!catSelect) return;
  const trigger = $('#catTrigger');
  const menu    = $('#catMenu');
  const hidden  = catSelect.querySelector('input[name=category]');
  const newInput = $('#catNewInput');
  const newBtn   = $('#catNewBtn');
  const setValue = (val) => {
    hidden.value = val;
    const label = trigger.querySelector('.cat-name');
    const dot   = trigger.querySelector('.cat-dot');
    const color = colorForCategory(val);
    dot.style.setProperty('--cat', color);
    label.textContent = val || 'Uncategorised';
    label.classList.toggle('is-empty', !val);
    menu.querySelectorAll('.cat-select-option').forEach(o => {
      const isSel = (o.dataset.value || '') === (val || '');
      o.classList.toggle('selected', isSel);
      o.setAttribute('aria-selected', isSel ? 'true' : 'false');
    });
  };
  const open = () => { menu.classList.add('open'); trigger.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); if(!('ontouchstart' in window)) setTimeout(() => { if(newInput) newInput.focus(); }, 80); };
  const close = () => { menu.classList.remove('open'); trigger.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); };
  trigger.onclick = (e) => { e.stopPropagation(); if(menu.classList.contains('open')) close(); else open(); };
  menu.querySelectorAll('.cat-select-option').forEach(opt => {
    opt.onclick = (e) => { e.stopPropagation(); setValue(opt.dataset.value || ''); close(); };
  });
  const addNewCategory = () => {
    const raw = (newInput.value || '').trim();
    if(!raw){ newInput.focus(); return; }
    const val = raw.slice(0, 40);
    const color = colorForCategory(val);
    const existing = menu.querySelector(`.cat-select-option[data-value="${cssEscape(val)}"]`);
    if(existing){ setValue(val); close(); return; }
    const newOpt = document.createElement('button');
    newOpt.type = 'button';
    newOpt.className = 'cat-select-option';
    newOpt.dataset.value = val;
    newOpt.style.setProperty('--cat', color);
    newOpt.setAttribute('role', 'option');
    newOpt.setAttribute('aria-selected', 'false');
    newOpt.innerHTML = `<span class="cat-dot"></span><span class="cat-opt-name">${esc(val)}</span><span class="cat-opt-count">0</span>`;
    newOpt.onclick = (e) => { e.stopPropagation(); setValue(val); close(); };
    const dividers = menu.querySelectorAll('.cat-select-divider');
    const newDivider = dividers[dividers.length - 1];
    if(newDivider) menu.insertBefore(newOpt, newDivider);
    else menu.insertBefore(newOpt, menu.firstChild);
    setValue(val);
    newInput.value = '';
    close();
    toast('New category ready');
  };
  newBtn.onclick = (e) => { e.stopPropagation(); addNewCategory(); };
  newInput.onkeydown = (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addNewCategory(); }
    else if(e.key === 'Escape'){ e.preventDefault(); close(); trigger.focus(); }
  };
  catOutsideHandler = (e) => { if(!catSelect.contains(e.target)) close(); };
  setTimeout(() => document.addEventListener('click', catOutsideHandler), 0);
}

function cssEscape(s){
  if(window.CSS && typeof CSS.escape === 'function') return CSS.escape(s);
  return String(s).replace(/["\\]/g, '\\$&');
}

function bindAdminGalleryActions(){
  document.querySelectorAll('[data-admin-cat]').forEach(b => {
    b.onclick = () => {
      adminFilter = b.dataset.adminCat;
      const panel = $('#adminGalleryPanel');
      if(panel){ panel.innerHTML = adminGalleryContentHTML(); bindAdminGalleryActions(); }
    };
  });
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      editingId = b.dataset.edit;
      pendingImage = null; pendingImageName = '';
      renderAdmin();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      const p = state.photos.find(x => x.id === b.dataset.del);
      if(!p) return;
      if(!confirm(`Delete "${p.title}"? This cannot be undone.`)) return;
      state.photos = state.photos.filter(x => x.id !== p.id);
      if(editingId === p.id){ editingId = null; pendingImage = null; pendingImageName = ''; }
      if(adminFilter !== 'All' && !state.photos.some(x => (x.category || '') === adminFilter)){ adminFilter = 'All'; }
      save();
      renderAdmin();
      toast('Photo deleted');
    };
  });
}

async function boot(){
  route();
  const cloud = await loadCloud();
  if(cloud){ state = cloud; saveLocal(); route(); }
}
boot();
</script>
